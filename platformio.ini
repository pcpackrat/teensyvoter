[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Dependencies
lib_deps =
    NativeEthernet
    ; Audio
    ; Wire
    ; SPI
    ; SerialFlash
    mikalhart/TinyGPSPlus @ ^1.0.3

; Build Options
build_flags = 
    -D USB_SERIAL ; Enable USB Serial for debugging
    -D TEENSY_OPT_FASTER ; Optimize for speed
    -D ARM_MATH_CM7 ; Enable CMSIS-DSP for Cortex-M7
    -D __FPU_PRESENT=1

lib_ldf_mode = deep+

; Monitor Options
monitor_speed = 115200

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
monitor_speed = 115200
; Point to the ESP32 firmware source
build_src_filter = +<../esp32_firmware/Spirit/> -<src/>
